name: build

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:

# 供应链卫生（S4）：顶层默认最小权限 contents: read；Release 发布在独立 job 中放开 write。
# 第三方 action 全部 pin commit SHA；tag 名经 env 注入（不经 ${{ }} 内插进脚本）。
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "10.0.x"

      - name: Run unit tests
        shell: pwsh
        run: |
          dotnet test tests/DshShell.Tests -c Release --nologo 2>&1 | Tee-Object -FilePath test-output.log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            Select-String -Path test-output.log -Pattern '^\s*(Failed|失败) ' | ForEach-Object { Write-Output ("::error file=tests::" + $_.Line.Trim()) }
            exit $code
          }

      - name: Upload test log on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-output
          path: test-output.log

      - name: Build release package (zip + msi + checksums)
        shell: pwsh
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          $ver = $env:REF_NAME
          if ($ver -like 'v*') {
            ./scripts/build-release.ps1 -OutputDir dist -Version $ver.TrimStart('v')
          } else {
            ./scripts/build-release.ps1 -OutputDir dist
          }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dsh-launcher-windows
          path: |
            dist/dsh-launcher-windows.zip
            dist/*.msi
            dist/SHA256SUMS.txt

  release:
    # 仅 tag 推送才发布 Release；独立 job 单独声明 contents: write（构建 job 保持只读）
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dsh-launcher-windows
          path: dist

      - name: Prepare release notes from CHANGELOG
        shell: pwsh
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          $tag = $env:REF_NAME
          $ver = $tag.TrimStart('v')
          $changelog = Get-Content CHANGELOG.md -Raw
          $m = [regex]::Match($changelog, "(?ms)^## \[$([regex]::Escape($ver))\] - .*?(?=^## |\z)")
          $body = if ($m.Success) {
            "## $tag`n`n" + $m.Value.TrimEnd()
          } else {
            "## $tag`n`n_No changelog entry for this version yet._"
          }
          if (Test-Path "dist\SHA256SUMS.txt") {
            $body += "`n`n## 校验和 (SHA256)`n``````text`n" + (Get-Content "dist\SHA256SUMS.txt" -Raw).TrimEnd() + "`n``````"
          }
          $body += @"

          ---

          ## 安装与卸载 / Install & Uninstall

          **MSI 安装包（推荐新手）**：双击安装，向导里可勾选是否开机自启；自动创建桌面与开始菜单快捷方式（含"卸载 dsh-launcher"）。卸载：设置 → 应用 → dsh-launcher → 卸载。

          **便携版 ZIP**：解压即用，双击 ``DshWeb.exe``；删文件夹即卸载（自启/快捷方式用 ``uninstall-autostart.cmd`` 清理）。

          > MSI 与 ZIP 内容完全相同；区别只在安装方式：MSI 有标准安装/卸载流程，适合新手；ZIP 免安装，适合便携党。
          > The MSI and ZIP contain the same files; the MSI adds a standard install/uninstall flow for new users, the ZIP is portable and install-free.
          "@
          Set-Content -Path body.md -Value $body -Encoding utf8

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            dist/dsh-launcher-windows.zip
            dist/*.msi
          body_path: body.md
          fail_on_unmatched_files: true
