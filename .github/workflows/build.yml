name: build

on:
  push:
    # v[0-9]*.*[0-9]* 这条分支模式是从 realos-test.yml 搬过来的：realos 并入本文件后，
    # 若不同步搬触发分支，向 v0.x 维护分支推送就会一个测试门禁都不剩（build 原来只盯 master）。
    branches: ["master", "v[0-9]*.*[0-9]*"]
    # 仅正式语义版本 tag 触发发布打包（v0.4.0 等）；preview tag（如 v0.4.0-preview）不触发——
    # 预览版由手动 gh release create 发布，且 build-release.ps1 仅接受 x.y.z 格式版本号。
    tags: ["v[0-9]*.[0-9]*.[0-9]*"]
  pull_request:
  # 手动触发用于验证打包链路（build-release.ps1 的 zip+MSI 步骤已改为只在 tag 上跑，
  # 想在发布前单独确认打包没坏，就用这个入口）。
  workflow_dispatch:

# 供应链卫生（S4）：顶层默认最小权限 contents: read；Release 发布在独立 job 中放开 write。
# 第三方 action 全部 pin commit SHA；tag 名经 env 注入（不经 ${{ }} 内插进脚本）。
permissions:
  contents: read

# 同一 ref 上只保留最新一次运行：连推 N 个 commit 时，旧 commit 的 Windows VM 立刻取消，
# 不再让新改动排在自家已过时的排队后面（本文件与另 4 个 workflow 此前都没有 concurrency 键，
# 实测每次 push 扇出 3 台 VM、连推 3 次就是 9 台）。
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # 预发布 tag（含 '-'，如 -rc.N/-preview）：只由手动 gh release create --prerelease 发布，
    # 自动流水线整体跳过（避免工作流把预发布又当成正式 Release 抢发/覆盖手动产物）。
    if: ${{ !contains(github.ref_name, '-') }}
    # 20 → 35 的理由（2026-09-26 实测，不是"为了变绿而放宽"）：
    #   · 本 job 里 Real-OS 层会走真实 npm/pnpm 安装路径，而**产品代码自己声明的上限**是
    #     ProcessRunner.cs:242 `PnpmInstallWallClockMs = 600_000`（10 分钟）与 test.ps1:450 钉的
    #     `timeoutMs: 1200000`（20 分钟）。job 预算只有 20 分钟时，一次合法的慢安装就会把
    #     整个 job 撞到超时——实测已两次发生（PR #38 首跑、PR #39，均卡在 "Run Real-OS integration
    #     tests"；两者都只改文档/配置，与产品代码无关）。
    #   · 正常路径的实测耗时：Real-OS 51s / 75s（master 33829fc 与 PR #32 二轮），静态检查步骤 61–73s，
    #     test.ps1 快线 31–35s ⇒ 35 分钟 = 产品 20 分钟上限 + 本 job 其它步骤 ~5 分钟 + 一倍余量。
    #   · 单条断言没被削弱：变的是资源预算，不是判据。
    timeout-minutes: 35
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "10.0.x"

      # ---- 静态检查（OpenSSF Best Practices: static_analysis / static_analysis_fixed / warnings_strict）----
      # 单独一步的理由：判据要能指出"哪个工具、在哪个环节跑、结果在哪看"，而不是藏在测试脚本里。
      # 工具 = SDK 内置 Roslyn 分析器（CA#### 规则集，AnalysisMode=Recommended）+ NuGet advisory 审计
      # （NU1901..1904），两者都在 Directory.Build.props 打开，并经 TreatWarningsAsErrors 变成红灯。
      # 判读表（哪条警告真修、哪条带证据关闭）在 docs/STATIC-ANALYSIS-2026-09-26.md。
      # 刻意**不开公开 CodeQL**：它会把未修的发现以公开 code-scanning 清单摊在仓库首页，
      # 与 .github/SECURITY.md 承诺的私密报告通道相矛盾。
      - name: Static analysis (Roslyn CA rules + NuGet advisory audit)
        shell: pwsh
        run: |
          dotnet build src/DshShell/DshShell.csproj -c Release -warnaserror --nologo
          dotnet build tests/DshShell.Tests/DshShell.Tests.csproj -c Release -warnaserror --nologo
          # CVE 比对：dotnet list 一次只收一个工程，逐个跑并汇总到同一份日志
          $projects = @(
            "src/DshShell/DshShell.csproj",
            "tests/DshShell.Tests/DshShell.Tests.csproj",
            "tests/DshShell.E2E/DshShell.E2E.csproj",
            "installer/PrereqCheck/PrereqCheck.csproj",
            "installer/FolderPicker/FolderPicker.csproj",
            "installer/FolderPickerCa/FolderPickerCa.csproj")
          foreach ($p in $projects) {
            dotnet list $p package --vulnerable --include-transitive | Tee-Object -FilePath vuln.log -Append
          }
          # 判据字符串来自实测：有漏洞时输出 "has the following vulnerable packages"，
          # 无漏洞时输出 "has no vulnerable packages given the current sources"（2026-09-26 用
          # Newtonsoft.Json 12.0.3 做过正对照，确认这条 pattern 会真的响，不是空闸门）。
          if (Select-String -Path vuln.log -Pattern 'has the following vulnerable packages' -Quiet) {
            Write-Output "::error title=vulnerable-packages::dotnet list package --vulnerable 发现已知 CVE，见本步日志"
            exit 1
          }

      - name: Upload static analysis log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: static-analysis
          path: vuln.log

      - name: Run tests (unit + script/integration checks, no -Smoke)
        # P1-5：test.ps1 是唯一测试入口（第 1 节内部已跑 dotnet test，此前独立
        # "Run unit tests" 步骤导致单测在 CI 双跑）；含静态断言 + uninstall/-CleanData
        # 隔离行为测试（防 R05 数据边界 / R06 脚本行为漂移）。纯只读 + %TEMP% 隔离，runner 上安全。
        # -SkipRealOs：Real-OS 层（Category=RealOS，57 条 / CI 实测 44s）不在这里跑，改由下面的 real-os step 跑。
        # 本地开发者裸跑 ./scripts/test.ps1 仍是全量硬门禁——这个开关只为去掉与 realos workflow
        # 的重复，不削弱任何一层的断言。
        shell: pwsh
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/test.ps1 -SkipRealOs 2>&1 | Tee-Object -FilePath test-scripts.log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            Select-String -Path test-scripts.log -Pattern '\[FAIL\]|项测试失败' | ForEach-Object { Write-Output ("::error file=scripts::" + $_.Line.Trim()) }
            exit $code
          }

      - name: Upload test log on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-output
          path: test-scripts.log

      # ---- Real-OS 层（原 realos-test.yml 整体并入本 job，省一整台 VM 的 checkout+setup-dotnet+冷编译）----
      # Stage 2a：确保真实 Node.js 环境（Real-OS 测试硬前提，绝不 Skip）
      - name: Ensure Node.js (real environment, never skip)
        shell: pwsh
        run: |
          $node = Get-Command node -ErrorAction SilentlyContinue
          if (-not $node) {
            Write-Host "node 未预装，通过 winget 真实安装 Node.js LTS..."
            winget install OpenJS.NodeJS.LTS --accept-source-agreements --accept-package-agreements --silent
            $env:Path = [System.Environment]::GetEnvironmentVariable("Path", "Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path", "User")
          }
          node --version

      # Stage 2b：运行 Real-OS 集成测试（零 Mock 真实 OS 交互）
      - name: Run Real-OS integration tests
        # 25 分钟（< job 的 35）是**故意让超时发生在步骤级而不是 job 级**：job 被 cancel 时
        # 后续步骤全部 skipped，`Upload Real-OS log on failure` 拿不到执行机会 ⇒ 失败完全无日志
        # （PR #38/#39 两次就是这么变成不可诊断的）。步骤超时会让 job 以失败继续往下走，
        # realos.log 因此能上传，红灯至少可查。取值 = 产品自述上限 20 分钟 + 5 分钟余量。
        timeout-minutes: 25
        # filter 字符串的唯一真相源是 scripts/test.ps1 里的 $realOsLayerFilter，这里不再抄第二份
        # （workflow 与脚本各存一份 filter = 迟早漂移，漂移的结果是某条真实用例两层都不跑）。
        # 失败留证(-v minimal + 120 行)与 DSH_FORCE_NPM_SMOKE 也由 test.ps1 负责。
        # RealNet 类别被排除：它依赖真实镜像下载构建（40 分钟级、境外 runner 不可达境内源），
        # 属于本地强制硬门禁而非 CI 门禁——CI 环境差异不应劫持发布流水线。
        shell: pwsh
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/test.ps1 -RealOsOnly 2>&1 | Tee-Object -FilePath realos.log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            # 只截 20 条：红灯已经确定，这些注解只回答"点开哪一条"，完整日志在 realos.log 产物里。
            Select-String -Path realos.log -Pattern 'Failed|\[FAIL\]' | Select-Object -First 20 | ForEach-Object { Write-Output ("::error file=tests::" + $_.Line.Trim()) }
            exit $code
          }

      - name: Upload Real-OS log on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: realos-test-output
          path: realos.log

      - name: Build release package (zip + msi + checksums)
        # 只在正式 tag（和手动 dispatch）上打包：产物唯一的消费方是本文件下方 needs: build 的
        # release job，而它只在 tag 上运行。此前每个 commit/PR 都花 ~39s 打一份没人要的 zip+MSI。
        # 打包脚本本身的回归仍由 tag 推送在发布前拦住（release 需要 build 成功）。
        # 【判据必须是单数 'tag'】GitHub 的 github.ref_type 只有 'branch' / 'tag' 两个取值。
        # 这里曾写成 'tags'，于是**推 tag 时打包与上传两步整体跳过**，release job 下载产物时
        # 报 "Artifact not found for name: dsh-launcher-windows" —— v0.5.0 的 tag run 就是这么红的
        # （当时靠 gh workflow run --ref v0.5.0 走 dispatch 分支绕行发出去的）。
        if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          $ver = $env:REF_NAME
          if ($ver -like 'v*') {
            ./scripts/build-release.ps1 -OutputDir dist -Version $ver.TrimStart('v')
          } else {
            ./scripts/build-release.ps1 -OutputDir dist
          }

      - name: Upload release artifacts
        # 判据与上一步同源（单数 'tag'）：两步必须同时生效，否则又是"打了包但没人上传"。
        if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dsh-launcher-windows
          path: |
            dist/dsh-launcher-windows-*.zip
            dist/*.msi
            dist/SHA256SUMS.txt

  release:
    # 仅正式 tag（不含 '-'）推送才发布 Release；独立 job 单独声明 contents: write（构建 job 保持只读）
    if: startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dsh-launcher-windows
          path: dist

      - name: Prepare release notes from CHANGELOG
        shell: pwsh
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          $ver = $env:REF_NAME.TrimStart('v')
          # 正文生成（抽版本小节 + 段内换行归一 + 校验和 + 安装说明）的唯一实现在
          # scripts/release-notes.ps1。本地校对/重发同一份正文也调它，不抄第二遍。
          # 【为什么必须归一换行】CHANGELOG 是硬折行写的，而 GitHub 的 Release 正文把单个换行
          # 渲染成硬换行（v0.5.1 实测正文里 26 个 <br>），公告因此看起来被强行截断、右边大片留白。
          # 发布闸门仍在此处生效：tag 指向的提交必须在 CHANGELOG.md 含 "## [x.y.z]" 条目——缺失
          # 直接 FAIL（v0.4.0 事故根因：占位文案 "_No changelog entry_" 被原样发上 Release 页）。
          # 脚本用 "::error title=missing-changelog::" + 退出码 1 表达这条，这里原样转成红灯。
          ./scripts/release-notes.ps1 -Version $ver -ChangelogPath CHANGELOG.md `
              -OutFile body.md -SumsPath dist/SHA256SUMS.txt
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error title=missing-changelog::release-notes.ps1 failed for $ver (see its own annotation)"
            exit 1
          }

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            dist/dsh-launcher-windows-*.zip
            dist/*.msi
            dist/SHA256SUMS.txt
          body_path: body.md
          fail_on_unmatched_files: true
