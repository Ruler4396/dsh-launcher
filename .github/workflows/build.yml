name: build

on:
  push:
    branches: [master]
    # 仅正式语义版本 tag 触发发布打包（v0.4.0 等）；preview tag（如 v0.4.0-preview）不触发——
    # 预览版由手动 gh release create 发布，且 build-release.ps1 仅接受 x.y.z 格式版本号。
    tags: ["v[0-9]*.[0-9]*.[0-9]*"]
  pull_request:

# 供应链卫生（S4）：顶层默认最小权限 contents: read；Release 发布在独立 job 中放开 write。
# 第三方 action 全部 pin commit SHA；tag 名经 env 注入（不经 ${{ }} 内插进脚本）。
permissions:
  contents: read

jobs:
  build:
    # 预发布 tag（含 '-'，如 -rc.N/-preview）：只由手动 gh release create --prerelease 发布，
    # 自动流水线整体跳过（避免工作流把预发布又当成正式 Release 抢发/覆盖手动产物）。
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "10.0.x"

      - name: Run tests (unit + script/integration checks, no -Smoke)
        # P1-5：test.ps1 是唯一测试入口（第 1 节内部已跑 dotnet test，此前独立
        # "Run unit tests" 步骤导致单测在 CI 双跑）；含静态断言 + uninstall/-CleanData
        # 隔离行为测试（防 R05 数据边界 / R06 脚本行为漂移）。纯只读 + %TEMP% 隔离，runner 上安全。
        shell: pwsh
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/test.ps1 2>&1 | Tee-Object -FilePath test-scripts.log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            Select-String -Path test-scripts.log -Pattern '\[FAIL\]|项测试失败' | ForEach-Object { Write-Output ("::error file=scripts::" + $_.Line.Trim()) }
            exit $code
          }

      - name: Upload test log on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-output
          path: test-scripts.log

      - name: Build release package (zip + msi + checksums)
        shell: pwsh
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          $ver = $env:REF_NAME
          if ($ver -like 'v*') {
            ./scripts/build-release.ps1 -OutputDir dist -Version $ver.TrimStart('v')
          } else {
            ./scripts/build-release.ps1 -OutputDir dist
          }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dsh-launcher-windows
          path: |
            dist/dsh-launcher-windows-*.zip
            dist/*.msi
            dist/SHA256SUMS.txt

  release:
    # 仅正式 tag（不含 '-'）推送才发布 Release；独立 job 单独声明 contents: write（构建 job 保持只读）
    if: startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dsh-launcher-windows
          path: dist

      - name: Prepare release notes from CHANGELOG
        shell: pwsh
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          $tag = $env:REF_NAME
          $ver = $tag.TrimStart('v')
          $changelog = Get-Content CHANGELOG.md -Raw
          # 发布闸门：tag 指向的提交必须在 CHANGELOG.md 含 "## [x.y.z]" 条目——缺失直接 FAIL，
          # 严禁以 "_No changelog entry_" 占位文案静默发布（v0.4.0 事故根因：tag 首推指向的
          # 提交没有该版本小节，fallback 占位文案被原样发上 Release 页且事后 tag 强移也未能刷新）。
          $m = [regex]::Match($changelog, "(?ms)^## \[$([regex]::Escape($ver))\] - .*?(?=^## |\z)")
          if (-not $m.Success) {
            Write-Host "::error title=missing-changelog::CHANGELOG.md has no '## [$ver]' entry on this tag commit; add it before releasing."
            exit 1
          }
          $body = "## $tag`n`n" + $m.Value.TrimEnd()
          if (Test-Path "dist\SHA256SUMS.txt") {
            $body += "`n`n## 校验和 (SHA256)`n``````text`n" + (Get-Content "dist\SHA256SUMS.txt" -Raw).TrimEnd() + "`n``````"
          }
          $body += @"

          ---

          ## 安装与卸载 / Install & Uninstall

          **MSI 安装包（推荐新手）**：双击安装，向导里可勾选是否开机自启；自动创建桌面与开始菜单快捷方式（含"卸载 dsh-launcher"）。卸载：设置 → 应用 → dsh-launcher → 卸载。

          **便携版 ZIP**：解压即用，双击 ``DshWeb.exe``；删文件夹即卸载（自启/快捷方式用 ``uninstall-autostart.cmd`` 清理）。ZIP 为框架依赖发布，**解压后建议先运行同目录 ``check-prereq.cmd`` 确认已安装 .NET Desktop Runtime 10 与 Node.js 18+**（MSI 安装包自带前置检查，无需手动）。

          > MSI 与 ZIP 内容完全相同；区别只在安装方式：MSI 有标准安装/卸载流程，适合新手；ZIP 免安装，适合便携党。
          > The MSI and ZIP contain the same files; the MSI adds a standard install/uninstall flow for new users, the ZIP is portable and install-free.
          "@
          Set-Content -Path body.md -Value $body -Encoding utf8

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            dist/dsh-launcher-windows-*.zip
            dist/*.msi
          body_path: body.md
          fail_on_unmatched_files: true
